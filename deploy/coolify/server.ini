# The official server's settings (server/README.md, Coolify deployment):
# deploy/coolify/compose.yaml mounts this file read-only at /app/server.ini
# in both services. A change here reaches the server with the next release
# (the app follows the `release` branch) and a restart; every key not set
# here keeps its default (server/server.example.ini).
[server]
# As WELCOME and /health show them: at most 64 and 160 bytes, printable.
name = Groundhold
motd = The official server. Names and signals only, no chat: be kind. Its policy: saschb2b.github.io/Groundhold/policy.html
# Inside its container; Coolify's proxy is in front, with the certificate.
host = 0.0.0.0
port = 8766
player_cap = 64
# (empty: four times player_cap)
party_cap =
# The published browser game's page; the desktop games send no Origin.
origins = https://saschb2b.github.io
free_text = false
# Set before a planned restart ("until 14:00 UTC", at most 40 printable
# characters): every game that comes is turned away with this line.
maintenance =
# The private state, a named volume (identity.key and moderation.json).
state_dir = /data
allowlist =
# (never sent from a container anyway)
beacon = false
# What the state keeps and for how long (server/README.md, What the state
# keeps): no players' log, archives 14 days, the daily totals (no names) a
# year.
log_days = 0
backup_days = 14
stats_days = 365
