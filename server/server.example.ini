# The Groundhold server's settings (server/README.md). The server needs
# none of them: started bare, it listens on every interface of this computer,
# port 8766. To change one, copy this file to server.ini beside the server (or
# in the folder it starts in), edit it and restart; --config names another
# file. Each line shows its default. Any of them can be set in the
# environment too, which wins over the file: GROUNDHOLD_SERVER_PORT=9000 for
# `port = 9000`.
[server]
# The server's name and its line of welcome, as WELCOME and /health show them.
name = Groundhold
motd = Hold the road together
# Where it listens: empty, every interface (other games on this network, and
# through a router's forwarded port); 127.0.0.1, this computer alone.
host =
port = 8766
# Players at once.
player_cap = 64
# The browser pages whose game may come in, exact origins separated by
# spaces: the published game's by default. A browser game needs wss:// (a
# certificate below, or a proxy in front). Empty: native games alone.
origins = https://saschb2b.github.io
# A certificate for wss:// here, or leave both out behind a TLS proxy.
# tls_certificate = /run/secrets/server-cert.pem
# tls_key = /run/secrets/server-key.pem
# Names and signals only: free_text = true refuses to start.
free_text = false
# Under maintenance: every game that comes is turned away with this line (at
# most 40 printable characters), e.g. "until 14:00 UTC"; empty: open.
maintenance =
# Development only: form a match from the first players to connect, as
# MODE:SEATS (classic:2), and the seed every such match gets (empty: random).
dev_match =
seed =
