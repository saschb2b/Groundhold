<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
<title>$GODOT_PROJECT_NAME</title>
<!-- The game page inside play/'s frame: a full-window canvas and a loading plate.
     Exported by Godot from web/shell.html (export_presets.cfg, html/custom_html_shell). -->
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #0c111c; }
#canvas { display: block; width: 100%; height: 100%; outline: none; }
#boot {
	position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
	background: radial-gradient(ellipse at 50% 40%, #2c3f63, #0c111c 70%);
	color: #f2c94c; font: 700 clamp(22px, 4vw, 40px) Georgia, "Noto Serif", serif; text-shadow: 0 2px 0 #0a0604;
}
#bar { width: min(60vw, 440px); height: 16px; border: 2px solid #a77a2c; border-radius: 3px; background: #1a1410; box-shadow: 0 0 0 2px #3a2508; }
#fill { height: 100%; width: 0; background: linear-gradient(#ffe9a8, #c9a24a 60%, #a77a2c); transition: width 0.2s; }
#status { font: 15px Georgia, "Noto Serif", serif; color: #efe3c4; text-shadow: none; max-width: 80vw; text-align: center; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0">Your browser cannot draw the game: it needs canvas and WebGL 2.</canvas>
<div id="boot">
	<div>Lantern Hollow</div>
	<div id="bar"><div id="fill"></div></div>
	<div id="status">Lighting the lanterns…</div>
</div>
<script src="$GODOT_URL"></script>
<script>
const config = $GODOT_CONFIG;
const canvas = document.getElementById("canvas");
const boot = document.getElementById("boot");
const fill = document.getElementById("fill");
const status = document.getElementById("status");
const missing = typeof Engine.getMissingFeatures === "function" ? Engine.getMissingFeatures({ threads: false }) : [];
if (missing.length) {
	status.textContent = "This browser cannot run the game. Missing: " + missing.join(", ");
} else {
	const engine = new Engine(Object.assign({}, config, { canvas: canvas }));
	engine.startGame({
		onProgress: (current, total) => {
			if (total > 0) {
				const percent = Math.round((100 * current) / total);
				fill.style.width = percent + "%";
				status.textContent = "Loading " + percent + "%";
			}
		},
	}).then(() => {
		boot.remove();
		canvas.focus();
	}).catch((error) => {
		status.textContent = "The game could not start: " + error;
	});
}
canvas.addEventListener("pointerdown", () => canvas.focus());
</script>
</body>
</html>
