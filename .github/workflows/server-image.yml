# The server's container image, for hosts who run their own with Docker
# (server/README.md, Container; deploy/selfhost/compose.yaml pulls it):
# server/Dockerfile built for x86-64 and ARM64 (a Raspberry Pi too) and pushed
# to the GitHub Container Registry as ghcr.io/OWNER/groundhold-server, tagged
# with the release's version (1.2.3), and 1.2 and latest while it is the newest
# release of its 1.2 and the newest of all, asked of the repository's tags
# before the build (tools/release/deploy.py newest); a 1.0.5 after 1.1.0 moves
# 1.0 alone. One push runs at a time (the job's concurrency group), so a
# release's job asks only once the earlier one's tags are out, and two
# releases close together never leave `latest` on the older one. GitHub keeps
# one job waiting in the group: a third release queued meanwhile cancels the
# waiting one, whose image then needs its job re-run (server/README.md, At a
# release). release.yml runs it on its tag (vX.Y.Z only: gate.py refuses any
# other) once the desktop exports and the native archives have passed; a dry
# run builds both architectures, pushes nothing and waits for no other run.
# The package is private when first pushed: its settings on GitHub make it
# public, once.
name: Server image

on:
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to build
        type: string
        required: true
      version:
        description: The release's version (1.2.3, from the tag v1.2.3); empty for a dry run
        type: string
        default: ''
      push:
        description: Push the image (false builds it alone)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Server image (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: server-image-${{ inputs.push && 'push' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # (latest=true|false, minor=true|false; with no version, a build alone, latest as before)
      - id: newest
        name: Whether this is the newest release, and the newest of its X.Y
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: python3 tools/release/deploy.py newest "v$VERSION"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/groundhold-server
          # (no latest of the action's own: it would add one to every semver tag)
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' && steps.newest.outputs.minor == 'true' }}
            type=raw,value=latest,enable=${{ inputs.version == '' || steps.newest.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=Groundhold server
            org.opencontainers.image.description=The multiplayer server of Groundhold: the hub and the turn sequencer
            org.opencontainers.image.licenses=MIT
      - id: commit
        name: The commit built, for the server's /health
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          build-args: |
            SOURCE_COMMIT=${{ steps.commit.outputs.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
