# Every push to main runs the gameplay scenarios with godot-agent-kit, exports
# the game for the browser and publishes it, with the project page around it,
# on GitHub Pages. Pull requests run the same checks and build without
# publishing, so a broken rule or export shows up before it lands.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GODOT_VERSION: 4.7.1

jobs:
  test:
    name: Gameplay scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The kit runs the scenarios; a dot folder, so Godot does not import it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: saschb2b/godot-agent-kit
          path: .kit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: godot
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot and its web template
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/web_nothreads_release.zip templates/version.txt -d templates
          rm templates.tpz
      - name: Lint the simulation for non-determinism
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 .kit/bin/godot-agent check . --sim-lint scripts/sim
      - name: Guard the retired names
        run: python3 tools/names_check.py
      - name: Run every scenario (headless)
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 .kit/bin/godot-agent scenario . --headless --timeout 300
      # High Water's balance gates (design 4.4): written by the generator, so a stale
      # file fails before the gates run.
      - name: Balance gates
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 tools/gen_balance_scenarios.py --check
          python3 .kit/bin/godot-agent scenario . tests/balance --headless --timeout 300

  net-smoke:
    name: Networked match smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: saschb2b/godot-agent-kit
          path: .kit
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: godot
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot and its web template
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/web_nothreads_release.zip templates/version.txt -d templates
          rm templates.tpz
      - name: The server's unit tests
        run: python3 -m unittest discover -s server/tests -t server/tests
      - name: The shaper's, the smoke's, the play page's and the release tools' unit tests
        run: |
          python3 -m unittest tools/net/test_shaper.py tools/net/test_smoke.py
          python3 -m unittest discover -s tests/web -t tests/web
          python3 -m unittest discover -s tools/release -t tools/release
      - name: Import the project
        run: ~/godot/godot --headless --path . --import
      # The real server and two headless games play a whole classic match (turns of
      # 10 ms: five times faster); their hash streams must be equal at every tick.
      - name: Two clients finish a match against the real server
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 tools/net/smoke.py --mode classic --clients 2 --turn-ms 10 --timeout 600 --out smoke
      # One topology at a time: a drop, a game killed and started again, a minority
      # resynced, two seats apart with their dumps, a party by code, and M1's.
      - name: Real-socket scenarios (convergence, faults, desyncs, a party by code)
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 .kit/bin/godot-agent scenario . tests/net/live --headless -j 1 --timeout 600
      # One client through tools/net/shaper.py: its link cut for 8 s (it rejoins and
      # finishes), then 150 +- 50 ms and a 3 s stall (the other's tick rate never drops).
      - name: Faults and a bad network against the real server
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 tools/net/smoke.py --faults --turn-ms 10 --timeout 600 --out smoke-faults
          python3 tools/net/smoke.py --shaper --turn-ms 10 --timeout 600 --out smoke-shaper
      # Two games boot into the hub against the real server's lobby: a party by code,
      # Ready and Start, loading, a High Water match (called wave by wave), the results,
      # and both back in the party.
      - name: The loop around a match against the real server
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 tools/net/smoke.py --flow --no-bot --timeout 600 --out smoke-flow
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: net-smoke
          path: |
            smoke
            smoke-faults
            smoke-shaper
            smoke-flow
          retention-days: 14

  build:
    name: Export for the browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Godot and only the web template from the 1.3 GB template archive, cached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: godot
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot and its web template
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/web_nothreads_release.zip templates/version.txt -d templates
          rm templates.tpz
      - name: Install the web template
        run: |
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir" && cp ~/godot/templates/* "$dir/"

      # The build's number is this run's (design 6.9): in data/build.json, inside the export, for
      # HELLO's build_seq (a party tells the newer build by it), and on the shell's .js, .wasm and
      # .pck as ?v= (design 6.8): Pages serves every file for 10 minutes, and a reload must never
      # pair one build's .wasm with another's .pck.
      - name: Number the build
        run: python3 tools/release/stamp.py build-json --build-seq "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA"
      - name: Import the project
        run: ~/godot/godot --headless --path . --import
      - name: Export the game
        run: |
          mkdir -p site/play/game
          ~/godot/godot --headless --path . --export-release "Web" "$PWD/site/play/game/index.html"
          test -s site/play/game/index.pck
          python3 tools/release/stamp.py shell --build-seq "$GITHUB_RUN_NUMBER" site/play/game/index.html
      - name: Assemble the site
        run: |
          cp -r web/index.html web/policy.html web/404.html web/assets site/
          cp web/play/index.html site/play/
          mkdir -p site/ui site/fonts site/media
          cp -r ui/console ui/icons site/ui/
          find site/ui -name '*.import' -delete -o -name '*.tres' -delete
          cp fonts/*.ttf fonts/OFL.txt site/fonts/
          cp docs/media/* site/media/
          touch site/.nojekyll
          du -sh site site/play/game

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 14
      - name: Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # The exported site in headless Chrome (agent-browser): play/?join=CODE reaches the game in the
  # frame, which joins that party on the official server (here the real server on 127.0.0.1), and
  # the shell asks for this build's files as ?v=<run number>. It does not hold the Pages deploy.
  join-link:
    name: A party's link through the play page
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: agent-browser and its Chrome
        run: |
          npm install -g agent-browser@0.37.1
          agent-browser install --with-deps
      - name: flow_join_link_through_iframe
        run: |
          python3 tests/web/flow_join_link_through_iframe.py --game site/play/game \
            --build-seq "$GITHUB_RUN_NUMBER" --out join-link --timeout 300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: join-link
          path: join-link
          retention-days: 14

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
