# Every push to main runs the gameplay scenarios with godot-agent-kit, exports
# the game for the browser and publishes it, with the project page around it,
# on GitHub Pages. Pull requests run the same checks and build without
# publishing, so a broken rule or export shows up before it lands.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GODOT_VERSION: 4.7.1

jobs:
  test:
    name: Gameplay scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The kit runs the scenarios; a dot folder, so Godot does not import it.
      - uses: actions/checkout@v7
        with:
          repository: saschb2b/godot-agent-kit
          path: .kit
      - uses: actions/cache@v6
        id: godot
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot and its web template
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/web_nothreads_release.zip templates/version.txt -d templates
          rm templates.tpz
      - name: Lint the simulation for non-determinism
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 .kit/bin/godot-agent check . --sim-lint scripts/sim
      - name: Guard the retired names
        run: python3 tools/names_check.py
      - name: Run every scenario (headless)
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 .kit/bin/godot-agent scenario . --headless --timeout 300
      # High Water's balance gates (design 4.4): written by the generator, so a stale
      # file fails before the gates run.
      - name: Balance gates
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 tools/gen_balance_scenarios.py --check
          python3 .kit/bin/godot-agent scenario . tests/balance --headless --timeout 300

  net-smoke:
    name: Networked match smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: saschb2b/godot-agent-kit
          path: .kit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v6
        id: godot
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot and its web template
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/web_nothreads_release.zip templates/version.txt -d templates
          rm templates.tpz
      - name: The server's unit tests
        run: python3 -m unittest discover -s server/tests -t server/tests
      - name: The shaper's, the smoke's and the play page's unit tests
        run: |
          python3 -m unittest tools/net/test_shaper.py tools/net/test_smoke.py
          python3 -m unittest discover -s tests/web -t tests/web
      - name: Import the project
        run: ~/godot/godot --headless --path . --import
      # The real server and two headless games play a whole classic match (turns of
      # 10 ms: five times faster); their hash streams must be equal at every tick.
      - name: Two clients finish a match against the real server
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 tools/net/smoke.py --mode classic --clients 2 --turn-ms 10 --timeout 600 --out smoke
      # One topology at a time: a drop, a game killed and started again, a minority
      # resynced, two seats apart with their dumps, a party by code, and M1's.
      - name: Real-socket scenarios (convergence, faults, desyncs, a party by code)
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 .kit/bin/godot-agent scenario . tests/net/live --headless -j 1 --timeout 600
      # One client through tools/net/shaper.py: its link cut for 8 s (it rejoins and
      # finishes), then 150 +- 50 ms and a 3 s stall (the other's tick rate never drops).
      - name: Faults and a bad network against the real server
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 tools/net/smoke.py --faults --turn-ms 10 --timeout 600 --out smoke-faults
          python3 tools/net/smoke.py --shaper --turn-ms 10 --timeout 600 --out smoke-shaper
      # Two games boot into the hub against the real server's lobby: a party by code,
      # Ready and Start, loading, a High Water match (called wave by wave), the results,
      # and both back in the party.
      - name: The loop around a match against the real server
        run: |
          export GODOT_PATH="$HOME/godot/godot"
          python3 tools/net/smoke.py --flow --no-bot --timeout 600 --out smoke-flow
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: net-smoke
          path: |
            smoke
            smoke-faults
            smoke-shaper
            smoke-flow
          retention-days: 14

  build:
    name: Export for the browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Godot and only the web template from the 1.3 GB template archive, cached.
      - uses: actions/cache@v6
        id: godot
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot and its web template
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/web_nothreads_release.zip templates/version.txt -d templates
          rm templates.tpz
      - name: Install the web template
        run: |
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir" && cp ~/godot/templates/* "$dir/"

      - name: Import the project
        run: ~/godot/godot --headless --path . --import
      - name: Export the game
        run: |
          mkdir -p site/play/game
          ~/godot/godot --headless --path . --export-release "Web" "$PWD/site/play/game/index.html"
          test -s site/play/game/index.pck
      - name: Assemble the site
        run: |
          cp -r web/index.html web/404.html web/assets site/
          cp web/play/index.html site/play/
          mkdir -p site/ui site/fonts site/media
          cp -r ui/console ui/icons site/ui/
          find site/ui -name '*.import' -delete -o -name '*.tres' -delete
          cp fonts/*.ttf fonts/OFL.txt site/fonts/
          cp docs/media/* site/media/
          touch site/.nojekyll
          du -sh site site/play/game

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 14
      - name: Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
