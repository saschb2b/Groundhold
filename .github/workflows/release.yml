# A version tag (v1.0.0) releases Groundhold (docs/design/core-loop.md 7.6, M5; server/README.md, At a
# release):
#
# - gate: what this run releases (tools/release/gate.py plan); a tag must be vX.Y.Z, project.godot's
#   config/version X.Y.Z, and CHANGELOG.md must have a "## X.Y.Z" section with a date (gate.py check),
#   and the tag must be on main (gate.py on-main), or nothing is built; the release tools' tests; the
#   build number of the Pages build of the commit;
# - desktop: the game for Linux, Windows and macOS (export_presets.cfg's desktop presets, Godot 4.7.1
#   and its templates, cached), Groundhold.exe checked for the icon and version the export writes
#   into it, the Linux build booted headless to the hub; then, in the packaging image
#   (packaging/Dockerfile), the Windows installer (NSIS) and portable zip, and the Linux AppImage
#   with its .zsync, .deb and tar.gz (tools/release/package.py), each started or opened as its
#   system would (the AppImage and the .deb's and tar.gz's game booted to the hub, the installer
#   known as a Nullsoft one);
# - macos, on a Mac: Godot's app signed ad hoc and packed as groundhold-macos.dmg with an
#   Applications link and a Read me, the app checked universal, signed and booting, the image
#   verified;
# - server-native and server-image: the server's five native archives and its zipapp's
#   (server-native.yml), and its image on ghcr.io (server-image.yml);
# - publish: the GitHub release, its text the release's page (docs/releases/vX.Y.Z.md, else the
#   CHANGELOG section) and the downloads by system (tools/release/release_notes.py), every file of
#   tools/release/assemble.py's list and SHA256SUMS.txt attached;
# - deploy, last: the official server follows the release. The `release` branch, which the Coolify
#   app tracks, moves to the tagged commit, and Coolify is asked to deploy it when the repository has
#   the COOLIFY_API_URL, COOLIFY_TOKEN and COOLIFY_APP_UUID secrets (tools/release/deploy.py).
#
# Run by hand (Actions, Release, Run workflow) it is a dry run unless told otherwise: everything is
# built and checked as a tag would be, the image for both architectures but not pushed, and the
# files are kept as the run's `release-dry-run` artifact; no release, no image, no deploy. Without a
# tag it dry-runs the branch it is run on at project.godot's version. With an existing tag and dry
# run off it releases that tag again: its files replaced, the branch moved (back) to it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag vX.Y.Z (empty, the branch it runs on, at project.godot's version)
        type: string
        default: ''
      dry_run:
        description: Build and check everything, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Version gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.commit.outputs.sha }}
      build_seq: ${{ steps.commit.outputs.build_seq }}
    steps:
      # (refs/tags/: a branch of the same name is never released by mistake)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - id: plan
        name: What this run releases
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: python3 tools/release/gate.py plan
      - name: The tag, project.godot and the CHANGELOG agree
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PUBLISH: ${{ steps.plan.outputs.publish }}
        run: |
          flags=()
          [ "$PUBLISH" = true ] || flags+=(--dry-run)
          python3 tools/release/gate.py check "v$VERSION" "${flags[@]}"
      # (a tag on another branch would publish and deploy that branch; the shallow checkout fetches
      # main down to the tag's commit, or all of it when the tag is not on it)
      - id: main
        name: The tag is on main
        if: steps.plan.outputs.tag != ''
        env:
          PUBLISH: ${{ steps.plan.outputs.publish }}
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          flags=()
          if [ "$PUBLISH" != true ]; then
            flags+=(--dry-run)
          fi
          python3 tools/release/gate.py on-main "$(git rev-parse HEAD)" origin/main "${flags[@]}"
      - name: The release tools' tests
        run: python3 -m unittest discover -s tools/release -t tools/release
      # The desktop builds carry the build number of the Pages build of the same commit, so a party
      # of browser and desktop players from one release counts them as one build (design 6.9); 0,
      # older than any web build, when Pages never built this commit.
      - id: commit
        name: The commit and its build number
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          sha="$(git rev-parse HEAD)"
          seq="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?head_sha=$sha&event=push&per_page=20" \
            --jq '[.workflow_runs[].run_number] | max // 0' 2>/dev/null || echo 0)"
          [[ "$seq" =~ ^[0-9]+$ ]] || seq=0
          if [ "$seq" = 0 ]; then
            echo "::warning::No Pages build of $sha: the desktop builds are build 0"
          fi
          {
            echo "sha=$sha"
            echo "build_seq=$seq"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG:-a dry run of $GITHUB_REF_NAME} ($sha), build $seq" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Game for Linux, Windows and macOS
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      BUILD_SEQ: ${{ needs.gate.outputs.build_seq }}
      SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
      # Godot and the three desktop templates from the 1.3 GB template archive, each checked against
      # the SHA512-SUMS.txt Godot publishes with them before it is unpacked, cached (the key names
      # the check: a cache from before it is never used).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: godot
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-desktop-sha512
      - name: Download Godot and its desktop templates
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          curl -fsSL -o "$editor" "$base/$editor"
          curl -fsSL -o "$templates" "$base/$templates"
          awk -v a="$editor" -v b="$templates" '$2 == a || $2 == b { print $1 "  " $2 }' SHA512-SUMS.txt > checked.txt
          if [ "$(wc -l < checked.txt)" != 2 ]; then
            echo "::error title=Godot::SHA512-SUMS.txt lists no sum for $editor or $templates"
            exit 1
          fi
          sha512sum --strict -c checked.txt
          unzip -q "$editor" && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm "$editor"
          unzip -q -j "$templates" templates/linux_release.x86_64 templates/windows_release_x86_64.exe \
            templates/macos.zip templates/version.txt -d templates
          rm "$templates" SHA512-SUMS.txt checked.txt
      - name: Install the templates
        run: |
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir" && cp ~/godot/templates/* "$dir/"
      - name: Number the build
        run: python3 tools/release/stamp.py build-json --build-seq "$BUILD_SEQ" --commit "$SHA"
      - name: Import the project
        run: ~/godot/godot --headless --path . --import
      # One export at a time; Godot exits non-zero when a preset cannot export.
      - name: Export the game
        run: |
          set -euo pipefail
          mkdir -p build/desktop/linux build/desktop/windows build/desktop/macos
          ~/godot/godot --headless --path . --export-release "Linux" "$PWD/build/desktop/linux/groundhold.x86_64"
          ~/godot/godot --headless --path . --export-release "Windows" "$PWD/build/desktop/windows/Groundhold.exe"
          ~/godot/godot --headless --path . --export-release "macOS" "$PWD/build/desktop/macos/Groundhold.zip"
          test -x build/desktop/linux/groundhold.x86_64
          test -s build/desktop/windows/Groundhold.exe
          test -s build/desktop/macos/Groundhold.zip
      # (export_presets.cfg's application/modify_resources: Godot writes the icon and the version
      # into the exe itself, no rcedit or Wine)
      - name: The Windows game carries its icon, version and manifest
        run: python3 tools/release/pe_resources.py build/desktop/windows/Groundhold.exe --icon packaging/icons/groundhold.ico --version "$VERSION"
      - name: The Linux build boots to the hub
        run: python3 tools/release/desktop_smoke.py build/desktop/linux/groundhold.x86_64 --build-seq "$BUILD_SEQ"
      # makensis, appimagetool on the static AppImage runtime (both pinned by version and SHA-256),
      # zsyncmake, dpkg-deb and the desktop-file and AppStream validators, in an image built here
      - name: Build the packaging image
        run: docker build -t groundhold-packaging packaging
      - name: Pack the Windows installer and zip, and the AppImage, .deb and tar.gz
        run: |
          set -euo pipefail
          pack=(docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" -w /src groundhold-packaging
            python3 tools/release/package.py)
          "${pack[@]}" windows build/desktop/windows --version "$VERSION" --out dist
          "${pack[@]}" linux build/desktop/linux --version "$VERSION" --out dist
      - name: Each package starts or opens as its system would
        run: |
          set -euo pipefail
          file dist/groundhold-windows-x64-setup.exe | tee /dev/stderr | grep -q 'Nullsoft Installer'
          python3 tools/release/pe_resources.py dist/groundhold-windows-x64-setup.exe --icon packaging/icons/groundhold.ico --version "$VERSION"
          unzip -l dist/groundhold-windows-x64.zip
          readelf -p .upd_info dist/groundhold-x86_64.AppImage | tee /dev/stderr \
            | grep -qF 'gh-releases-zsync|saschb2b|Groundhold|latest|groundhold-x86_64.AppImage.zsync'
          test -s dist/groundhold-x86_64.AppImage.zsync
          APPIMAGE_EXTRACT_AND_RUN=1 python3 tools/release/desktop_smoke.py dist/groundhold-x86_64.AppImage --build-seq "$BUILD_SEQ"
          dpkg-deb -I dist/groundhold_amd64.deb
          dpkg-deb -x dist/groundhold_amd64.deb "$RUNNER_TEMP/deb"
          python3 tools/release/desktop_smoke.py "$RUNNER_TEMP/deb/usr/bin/groundhold" --build-seq "$BUILD_SEQ"
          mkdir -p "$RUNNER_TEMP/tar"
          tar -xvzf dist/groundhold-linux-x64.tar.gz -C "$RUNNER_TEMP/tar"
          python3 tools/release/desktop_smoke.py "$RUNNER_TEMP/tar/Groundhold/groundhold" --build-seq "$BUILD_SEQ"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-desktop
          path: |
            dist/groundhold-windows-x64-setup.exe
            dist/groundhold-windows-x64.zip
            dist/groundhold-x86_64.AppImage
            dist/groundhold-x86_64.AppImage.zsync
            dist/groundhold_amd64.deb
            dist/groundhold-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
      # (the macOS job signs and packs it on a Mac)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-export
          path: build/desktop/macos/Groundhold.zip
          if-no-files-found: error
          retention-days: 3

  # The app signed ad hoc (Apple silicon runs nothing unsigned; it is not notarised) and its disk
  # image, made with Apple's codesign and hdiutil, which run only on a Mac.
  macos:
    name: Game for macOS
    needs: [gate, desktop]
    runs-on: macos-15
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      BUILD_SEQ: ${{ needs.gate.outputs.build_seq }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
      # (the runner's own python3 may be older than the 3.10 the release's tools need: gate.py, which
      # package.py and desktop_smoke.py import, fails at import on 3.9)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-export
          path: build/desktop/macos
      - name: Sign the app and pack the disk image
        run: python3 tools/release/package.py macos build/desktop/macos/Groundhold.zip --version "$VERSION" --out dist
      - name: One app for Apple silicon and Intel, signed, that boots, in an image that verifies
        run: |
          set -euo pipefail
          app=build/package/macos/dmg/Groundhold.app
          bin="$app/Contents/MacOS/Groundhold"
          archs=" $(lipo -archs "$bin") "
          echo "architectures:$archs"
          [[ "$archs" == *" x86_64 "* && "$archs" == *" arm64 "* ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = io.github.saschb2b.Groundhold
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$VERSION"
          test -n "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")"
          python3 tools/release/desktop_smoke.py "$bin" --build-seq "$BUILD_SEQ"
          hdiutil verify dist/groundhold-macos.dmg
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/groundhold-macos.dmg
          ls -la "$RUNNER_TEMP/dmg"
          test -L "$RUNNER_TEMP/dmg/Applications" && test -s "$RUNNER_TEMP/dmg/Read me.txt"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/Groundhold.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-macos
          path: dist/groundhold-macos.dmg
          if-no-files-found: error
          retention-days: 14

  # the server's five native builds and its zipapp's archive, each on its own system (PyInstaller
  # does not cross-compile), each smoke-tested outside the checkout; uploaded as server-<target>
  server-native:
    needs: gate
    uses: ./.github/workflows/server-native.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
      version: ${{ needs.gate.outputs.version }}

  # the server's image on ghcr.io, tagged X.Y.Z, X.Y and latest: not a file of the release, so the
  # release waits on none of it, but the deploy does; it waits for the release's builds, so a tag
  # whose export or native smoke fails pushes no image (self-hosts pull `latest`); a dry run builds
  # it and pushes nothing
  server-image:
    needs: [gate, desktop, macos, server-native]
    uses: ./.github/workflows/server-image.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.gate.outputs.sha }}
      version: ${{ needs.gate.outputs.version }}
      push: ${{ needs.gate.outputs.publish == 'true' }}

  publish:
    name: GitHub release
    needs: [gate, desktop, macos, server-native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: game-desktop
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: game-macos
          path: dist
      - name: Every file, and their checksums
        run: python3 tools/release/assemble.py dist --list files.txt
      # (the release's page, docs/releases/vX.Y.Z.md, else its CHANGELOG section; then the downloads by
      # system with their sizes and checksums: release_notes.py, .claude/skills/release/SKILL.md)
      - name: Notes
        run: |
          python3 tools/release/release_notes.py "v$VERSION" --dist dist > NOTES.md
          python3 tools/release/release_notes.py "v$VERSION" --title > TITLE.txt
          cat NOTES.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: needs.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t files < files.txt
          title="$(cat TITLE.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${files[@]}"
            gh release edit "$TAG" --title "$title" --notes-file NOTES.md
          else
            gh release create "$TAG" --verify-tag --title "$title" --notes-file NOTES.md "${files[@]}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.gate.outputs.publish != 'true'
        with:
          name: release-dry-run
          path: |
            dist
            NOTES.md
          retention-days: 7

  # Last: the official server follows the release, never a push to main (design 6.11). The Coolify
  # app tracks the `release` branch; the job moves it to the tagged commit (forced, but on a tag
  # push only when the tag is the newest release; by hand, an older tag rolls back) and, after a
  # move, with the three COOLIFY_* secrets, asks Coolify's API to deploy it, failing
  # when Coolify answers an error. Without them it says so and succeeds: Coolify's own Auto Deploy
  # on the branch, or its Deploy button, takes it from there. GitHub refuses a GITHUB_TOKEN push that
  # changes .github/workflows/ on the branch; a RELEASE_BRANCH_TOKEN secret (a fine-grained token
  # with Contents and Workflows write on this repository) is used instead where there is one.
  deploy:
    name: Deploy the official server
    needs: [gate, publish, server-image]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: official-server
      cancel-in-progress: false
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          token: ${{ secrets.RELEASE_BRANCH_TOKEN || github.token }}
      # (a tag push moves it only to the newest release tag: two tags pushed close together release
      # in parallel, and the older one's deploy may come last; a release by hand is a rollback)
      - id: push
        name: Move the release branch to the tag
        env:
          EVENT: ${{ github.event_name }}
        run: |
          flags=()
          if [ "$EVENT" = push ]; then
            flags+=(--newest-only)
          fi
          python3 tools/release/deploy.py push "$SHA" --tag "$TAG" "${flags[@]}"
          if grep -qx 'moved=true' "$GITHUB_OUTPUT"; then
            echo "The release branch is at $SHA ($TAG)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The release branch stays: $TAG is not the newest release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Ask Coolify to deploy it
        if: steps.push.outputs.moved == 'true'
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: python3 tools/release/deploy.py coolify
